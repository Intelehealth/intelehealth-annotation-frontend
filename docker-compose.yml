services:

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: dyno-frontend:latest
    container_name: dyno-frontend
    restart: always              # always restart — even after Docker Desktop restarts
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    # Limit RAM so the container never OOMs and crashes the whole WSL2 instance
    deploy:
      resources:
        limits:
          memory: 512M          # Next.js standalone runtime uses ~150-200 MB
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "grep -qs ':0BB8' /proc/net/tcp || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dyno-frontend-net

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  dyno-frontend-net:
    driver: bridge
